name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run ShellCheck
        run: shellcheck bin/wokenv install.sh tests/e2e.sh

      - name: Check the config generator syntax
        run: node --check lib/wokenv-config.cjs

  e2e:
    name: End-to-end (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout the image sources
        uses: actions/checkout@v6
        with:
          repository: wokenv/base
          path: .base

      # Built from source so that a change here is tested against the image
      # it will ship with, not the one currently on Docker Hub.
      - name: Build the Wokenv image
        run: docker build --build-arg NODE_VERSION=${{ matrix.node }} --tag frugan/wokenv:latest .base

      - name: Run the end-to-end test
        run: tests/e2e.sh
