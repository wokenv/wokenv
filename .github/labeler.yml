# Auto-label PRs based on changed files
"area: core":
  - any: ["bin/**", "lib/**", "schemas/**", "docker-compose.yml", "*.sh"]

"area: tests":
  - any: ["tests/**"]

"area: docs":
  - any: ["*.md", "docs/**"]

"area: ci/cd":
  - any: [".github/**"]

"area: dependencies":
  - any: ["package.json", "composer.json", "package-lock.json", "composer.lock"]
